<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --gold: #C9A84C; --gold-light: #F0C96B; --gold-dark: #8B6B1F; --bg-dark: #0D0D0D; --bg-card: #181818; --text: #F0EDE6; --text-muted: #888; --border: rgba(201,168,76,0.25); }
  body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text); min-height: 100vh; }
  .topbar { background: #080808; border-bottom: 1px solid var(--border); padding: 8px 0; text-align: center; font-size: 13px; color: var(--gold-light); letter-spacing: 0.08em; }
  header { background: var(--bg-dark); border-bottom: 1px solid var(--border); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; gap: 20px; position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; flex-direction: column; line-height: 1; text-decoration: none; }
  .logo-main { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); letter-spacing: 0.06em; }
  .logo-sub { font-size: 10px; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  .btn-icon { color: var(--gold); display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 8px; transition: background 0.2s, border-color 0.2s; text-decoration: none; }
  .btn-icon:hover { background: rgba(201,168,76,0.15); border-color: var(--gold); }
  nav { background: #111; border-bottom: 1px solid var(--border); padding: 0 40px; display: flex; align-items: center; overflow-x: auto; }
  nav a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 0.05em; padding: 14px 20px; border-bottom: 2px solid transparent; transition: all 0.2s; text-transform: uppercase; white-space: nowrap; }
  nav a:hover, nav a.active { color: var(--gold); border-bottom-color: var(--gold); }
  .page-hero { background: linear-gradient(135deg, #0D0D0D 0%, #1a1200 50%, #0D0D0D 100%); border-bottom: 1px solid var(--border); padding: 48px 40px 36px; }
  .page-eyebrow { font-size: 11px; letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .page-eyebrow::before { content: ''; display: block; width: 30px; height: 1px; background: var(--gold); }
  .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 5vw, 56px); line-height: 1; color: var(--text); }
  .page-title span { color: var(--gold); }
  .section { padding: 48px 40px; }
  .filter-tabs { display: flex; gap: 8px; margin-bottom: 36px; flex-wrap: wrap; }
  .filter-tab { background: #1e1e1e; border: 1px solid var(--border); color: var(--text-muted); border-radius: 20px; padding: 7px 18px; font-size: 13px; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
  .filter-tab:hover, .filter-tab.active { background: var(--gold); color: #0D0D0D; border-color: var(--gold); font-weight: 600; }
  .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .product-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
  .product-card:hover { transform: translateY(-4px); border-color: var(--gold); }
  .carousel { position: relative; aspect-ratio: 1/1; background: #111; overflow: hidden; }
  .carousel-track { display: flex; height: 100%; transition: transform 0.35s ease; }
  .carousel-track img { min-width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; }
  .carousel-track .placeholder { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 80px; flex-shrink: 0; background: #1a1a1a; }
  .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.55); border: 1px solid var(--border); color: var(--gold); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; z-index: 2; transition: background 0.2s; }
  .carousel-btn:hover { background: rgba(201,168,76,0.25); }
  .carousel-btn.prev { left: 8px; } .carousel-btn.next { right: 8px; }
  .carousel-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
  .carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: background 0.2s; }

  .badge { position: absolute; top: 10px; left: 10px; background: #555; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 4px; padding: 3px 8px; z-index: 3; }
  .product-info { padding: 14px 16px 8px; }
  .product-league { font-size: 10px; color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }
  .product-name { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text); }
  .product-price { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .price-current { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); }
  .price-old { font-size: 12px; color: var(--text-muted); text-decoration: line-through; }
  .sizes-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .size-btn { background: #222; border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 4px 9px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
  .size-btn:hover:not(.agotado) { border-color: var(--gold); color: var(--gold); }
  .size-btn.selected { background: var(--gold); border-color: var(--gold); color: #0D0D0D; }
  .size-btn.agotado { color: var(--text-muted); border-color: #333; text-decoration: line-through; cursor: not-allowed; opacity: 0.5; }
  .product-footer { padding: 0 16px 14px; }
  .btn-buy { width: 100%; background: transparent; color: var(--gold); border: 1px solid var(--gold); border-radius: 6px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
  .btn-buy:hover { background: var(--gold); color: #0D0D0D; }
  footer { background: #080808; border-top: 1px solid var(--border); padding: 24px 40px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  footer p { font-size: 12px; color: var(--text-muted); }
  .footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); letter-spacing: 0.08em; }
  @media (max-width: 768px) {
    header { padding: 14px 20px; } nav { padding: 0 20px; } .page-hero { padding: 36px 20px 28px; } .section { padding: 36px 20px; }
    .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } .product-name { font-size: 12px; } .price-current { font-size: 18px; } .btn-buy { font-size: 11px; padding: 8px; } .size-btn { padding: 3px 7px; font-size: 10px; }
    footer { padding: 20px; flex-direction: column; text-align: center; }
  }

  /* LIGHTBOX */
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; align-items: center; justify-content: center; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: min(90vw, 800px); max-height: 90vh; object-fit: contain; width: auto; height: auto; border-radius: 8px; pointer-events: none; }
  .lightbox-close { position: absolute; top: 20px; right: 28px; color: #fff; font-size: 36px; cursor: pointer; line-height: 1; opacity: 0.8; transition: opacity 0.2s; }
  .lightbox-close:hover { opacity: 1; }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); color: #fff; width: 48px; height: 48px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; z-index: 2; }
  .lightbox-nav:hover { background: rgba(201,168,76,0.4); border-color: var(--gold); color: var(--gold); }
  .lightbox-nav.prev { left: 20px; }
  .lightbox-nav.next { right: 20px; }
  .carousel-track img { cursor: zoom-in; }
</style>
</head>

<script>
  const carouselState = {};
  function moveCarousel(id, dir) {
    const el = document.getElementById(id);
    const track = el.querySelector('.carousel-track');
    const slides = track.children.length;
    if (!carouselState[id]) carouselState[id] = 0;
    carouselState[id] = (carouselState[id] + dir + slides) % slides;
    track.style.transform = `translateX(-${carouselState[id] * 100}%)`;
    el.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === carouselState[id]));
  }
  function selectSize(btn) {
    if (btn.classList.contains('agotado')) return;
    btn.closest('.sizes').querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    const buyBtn = btn.closest('.product-card').querySelector('.btn-buy');
    buyBtn.disabled = false;
    buyBtn.style.opacity = '1';
    buyBtn.style.cursor = 'pointer';
  }
  function pedirPorWhatsapp(producto, btn) {
    const card = btn.closest('.product-card');
    const selected = card.querySelector('.size-btn.selected');
    if (!selected) return;
    const msg = encodeURIComponent(`Hola! Quiero comprar la camiseta: *${producto}* - Talle: *${selected.textContent.trim()}*`);
    window.open('https://wa.me/598098037399?text=' + msg, '_blank');
  }
  document.querySelectorAll('.btn-buy').forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = '0.4';
    btn.style.cursor = 'not-allowed';
  });
  function filterProducts(btn, cat) {
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.product-card').forEach(card => {
      card.style.display = (cat === 'all' || card.dataset.cat === cat) ? '' : 'none';
    });
  }

    // LIGHTBOX
  let lightboxImgs = [];
  let lightboxIndex = 0;

  function openLightbox(img) {
    // Recolectar TODAS las imágenes visibles del catálogo
    lightboxImgs = Array.from(document.querySelectorAll('.product-card:not(.hidden) .carousel-track img'));
    lightboxIndex = lightboxImgs.indexOf(img);
    if (lightboxIndex === -1) lightboxIndex = 0;
    showLightboxImg();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLightboxImg() {
    const img = lightboxImgs[lightboxIndex];
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox-img').alt = img.alt;
    // Mostrar/ocultar flechas
    const show = lightboxImgs.length > 1;
    document.querySelectorAll('.lightbox-nav').forEach(b => b.style.display = show ? 'flex' : 'none');
  }

  function lightboxNav(dir) {
    if (!lightboxImgs.length) return;
    lightboxIndex = (lightboxIndex + dir + lightboxImgs.length) % lightboxImgs.length;
    showLightboxImg();
  }

  function closeLightbox(e) {
    if (e.target.id === 'lightbox') {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
  }

  document.addEventListener('keydown', e => {
    const lb = document.getElementById('lightbox');
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') { lb.classList.remove('open'); document.body.style.overflow = ''; }
    if (e.key === 'ArrowRight') lightboxNav(1);
    if (e.key === 'ArrowLeft') lightboxNav(-1);
  });

  document.querySelectorAll('.carousel-track img').forEach(img => {
    img.addEventListener('click', () => openLightbox(img));
  });
</script>
